syntax = "proto3";

package ecsp;

// ---------------------------------------------------------------------------
// Main Envelope Message
// ---------------------------------------------------------------------------
message HostTargetMessage {
    oneof payload {
        // Both
        Ack ack = 1;
        Sync sync = 2;
        SyncRelease sync_release = 3;
        
        // Host -> Target Commands
        GetTests get_tests = 50;
        GetTest get_test = 51;
        ExecuteTest execute_test = 52;
        
        // Target -> Host Responses & Events
        GetTestsResponse get_tests_response = 101;
        GetTestResponse get_test_response = 102;
        TestStep test_step = 103;
        Log log = 104;
        TestFinished test_finished = 105;
    }
}

// ===========================================================================
// Commands (Host -> Target)
// ===========================================================================

message GetTests {
    // Empty message; triggers the target to report total number of tests
}

message GetTest {
    uint32 index = 1; // Request details for a specific test index
}

message ExecuteTest {
    uint32 index = 1; // Command to start execution of a specific test
}

message SyncRelease {
    uint32 sync_id = 1; // Tells the target it can unblock and resume execution
}

// ===========================================================================
// Responses (Target -> Host)
// ===========================================================================

message GetTestsResponse {
    uint32 total_tests = 1; // Total number of tests registered on the target
}

message GetTestResponse {
    uint32 index = 1;
    string name = 2;        // The name of the test
}

message Ack {
    bool success = 1;       // True for ACK, False for NACK
    string error_message = 2; // Populated only if NACK (e.g., "Index out of bounds")
}

// ===========================================================================
// Asynchronous Events (Target -> Host)
// ===========================================================================

message TestStep {
    uint32 step_number = 1;
    string description = 2;
    bool success = 3;
}

message Log {
    enum LogLevel {
        INFO = 0;
        WARNING = 1;
        ERROR = 2;
    }
    LogLevel level = 1;
    string message = 2;
}

message Sync {
    uint32 sync_id = 1; // Target blocks itself and sends this ID to Host
}

message TestFinished {
    enum Status {
        SUCCESS = 0;
        FAIL = 1;
        ABORTED = 2; // e.g., stopped due to a critical hardware fault or timeout
    }
    Status status = 1;
}