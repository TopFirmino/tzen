# Tzen
# Author: L. Furcas
# SPDX-License-Identifier: MPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tzen"
version = "0.1.0"
description = "Cooperative embedded test harness client over CRC-protected TTP"
readme = "python/tzen/README.md"
authors = [{name = "L. Furcas"}]
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["protobuf>=7.35.0,<8", "pyserial>=3.5,<4", "pytest>=8,<10", "tomli>=2; python_version < '3.11'"]

[project.entry-points.pytest11]
tzen = "tzen.plugin"

[tool.setuptools]
packages = ["tzen", "ttp", "ttp.python", "ttp.python.generated"]
package-dir = {tzen = "python/tzen"}

[tool.setuptools.package-data]
tzen = ["py.typed"]
"ttp.python.generated" = ["*.pyi"]

[tool.pytest.ini_options]
pythonpath = ["."]
log_format = "%(levelname)s  %(name)s  %(message)s"
testpaths = ["python/tests", "ttp/tests", "testharness-c/tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "types-protobuf>=7.35.1.20260906",
    "types-pyserial>=3.5.0.20261104",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["nanopb", "ttp/python/generated", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["python/tzen", "ttp/python/ttp.py"]
mypy_path = ["python"]
check_untyped_defs = true
warn_unused_ignores = true
